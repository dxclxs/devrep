# Строка для частичного переопределения шаблона openresty-art.fullname (сохранит имя релиза)
nameOverride: "nginx-art"
# Строка для частичного переопределения шаблона openresty-art.fullname
fullnameOverride: "nginx"

# Параметры deployment
application:
  replicaCount: 3
  revisionHistoryLimit:
    3
    # Параметры образа контейнера
  image:
    repository: nginx
    tag: "1.31.8"
    pullPolicy: IfNotPresent
  probes:
    readinessProbe:
      httpGet:
        path: /index.html
        port: htpp
      initialDelaySeconds: 5
      periodSeconds: 15
    livenessProbe:
      httpGet:
        path: /index.html
        port: http
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 5
  # Определение ресурсов
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  mountPathHtml: /usr/share/nginx/html/
  mountPathConfig: /etc/nginx/conf.d/

# Настройки сервиса
service:
  type: NodePort
  port: 80
  namePort: "http"
  nodePort: 31003

# Настройки ingress
ingress:
  # По умолчанию ingress отключён
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Основной конфигурационный файл
conf:
  default: |
    server {
      listen 80;
      server_name localhost;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }

# Список html файлов
html:
  index: |
    <html>
    <head>
        <title>Страница nginx</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Страница nginx</h1>

    </body>
    </html>
  50x: |
    <!DOCTYPE html>
    <html>
    <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Error</title>
    <style>
        body {
            width: 35em;
            margin: 0 auto;
            font-family: Tahoma, Verdana, Arial, sans-serif;
        }
    </style>
    </head>
    <body>
    <h1>An error occurred.</h1>
    <p>Sorry, the page you are looking for is currently unavailable.<br/>
    Please try again later.</p>
    </body>
    </html>
